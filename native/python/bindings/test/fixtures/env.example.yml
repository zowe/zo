# Example environment variables for testing
# Copy this file to env.yml and fill in the values
OWNER: TESTUSER
DSN_PREFIX: TEST.DATASET
USS_BASE_DIR: /tmp/test_uss_functions
# Prefix for scratch key rings/labels created by test_zkr.py (kept short: RACDCERT
# labels and dataset qualifiers have length limits).
KEYRING_PREFIX: ZKRUT

# Optional: point test_zkr.py's certificate lifecycle tests (Tier C) at a curated
# PKCS#12 fixture instead of self-provisioning one via RACDCERT GENCERT/EXPORT. Set as
# environment variables (not in this file) before running the tests:
#   ZKR_TEST_P12=/path/to/fixture.p12
#   ZKR_TEST_P12_PASS=the-p12-passphrase
# buildTools.ts forwards local ZNP_* variables to the remote runner verbatim, so
# ZNP_ZKR_TEST_P12 / ZNP_ZKR_TEST_P12_PASS also work when set locally.
