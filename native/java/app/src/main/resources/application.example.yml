server:
  port: ${apiml.service.port}
  ssl:
    keyStore: "config/keystore.p12"
    keyStorePassword: "password"
    keyStoreType: PKCS12
    keyPassword: "password"
    keyAlias: server
    trustStore: "config/truststore.p12"
    trustStorePassword: "password"
    protocol: TLSv1.3

spring:
  main:
    allow-bean-definition-overriding: true
  cloud:
    compatibility-verifier:
      enabled: true
  application:
    name: zo-java-service

apiml:
  enabled: true
  service:
    preferIpAddress: false

    serviceId: zo
    title: zo REST API
    description: Sample REST API for zo functionality

    discoveryServiceUrls: https://<host>:<ds-port>/eureka/

    scheme: https

    hostname: <host>
    port: <port>
    baseUrl: ${apiml.service.scheme}://${apiml.service.hostname}:${apiml.service.port}
    contextPath: /
    authentication:
      scheme: zoweJwt
    homePageRelativeUrl: ${apiml.service.contextPath}
    statusPageRelativeUrl: ${apiml.service.contextPath}/application/info
    healthCheckRelativeUrl: ${apiml.service.contextPath}/application/health

    routes:
      - gateway-url: "/api/v1"
        service-url: /zosmf

    apiInfo:
      - apiId: zowe.apiml.zo.rest
        version: 1.0.0
        gatewayUrl: api/v1
        swaggerUrl: ${apiml.service.scheme}://${apiml.service.hostname}:${apiml.service.port}${apiml.service.contextPath}/v3/api-docs
        documentationUrl: https://www.zowe.org
        defaultApi: true
    catalog:
      tile:
        id: zo
        title: zo REST API
        description: Sample REST API for zo functionality
        version: 1.0.1
    ssl:
      enabled: true
      verifySslCertificatesOfServices: true
      protocol: ${server.ssl.protocol}
      keyStoreType: ${server.ssl.keyStoreType}
      trustStoreType: ${server.ssl.keyStoreType}

      keyAlias: ${server.ssl.keyAlias}
      keyPassword: ${server.ssl.keyPassword}
      keyStore: ${server.ssl.keyStore}
      keyStorePassword: ${server.ssl.keyStorePassword}
      trustStore: ${server.ssl.trustStore}
      trustStorePassword: ${server.ssl.trustStorePassword}
    customMetadata:

      apiml:
        gatewayPort: <gw-port>
        gatewayAuthEndpoint: /gateway/api/v1/auth

eureka:
  client:
    enabled: false
    serviceUrl:
      defaultZone: https://localhost:10011/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    securePortEnabled: true
    nonSecurePortEnabled: false
    statusPageUrlPath: /application/health
    homePageUrlPath: /
    healthCheckUrlPath: /application/health

logging:
  level:
    org.springframework: WARN

debug: false
