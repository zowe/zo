activeProfile: default

profiles:
  default:
    # Name of Zowe SSH profile used to connect to z/OS
    # If you don't have Zowe profiles, run `zowe config init` to create a team configuration file.
    # Or uncomment the section below to define SSH config inline rather than using a Zowe profile.
    sshProfile: ssh
    # sshProfile:
    #   host: example.com
    #   port: 22
    #   user: ibmuser
    #   privateKey: /Users/ibmuser/.ssh/id_rsa
    #   # password: password  # Use password instead of private key

    # USS directory on z/OS where native code is built
    deployDir: ~/zowex

    # Python wheel runtime locations. Local ZPY_* environment variables override these.
    # Default root: /usr/lpp/IBM/cyp/; expects v3r{11,13,14}/pyz/bin/python.
    # Override individual executables for installations with a different layout.
    pythonEnv:
      ZPY_PYTHON_ROOT: /usr/lpp/IBM/cyp/
      # ZPY_PYTHON_311: /path/to/python3.11
      # ZPY_PYTHON_313: /path/to/python3.13
      # ZPY_PYTHON_314: /path/to/python3.14

    # Command to run before building the native code
    # preBuildCmd: '. ~/entrypoint.sh'  # Run script to configure build environment
    #
    # Put the supported Open XL C/C++ level on the PATH. See native/c/compat/README.md for why
    # the level matters and which one to pick.
    # preBuildCmd: 'export PATH=/usr/lpp/IBM/cnw/v2r1/openxl/bin:$PATH'
    #
    # If the bind fails with unresolved _ZNSt... references, name the LE C++ side decks
    # explicitly. See native/c/compat/README.md.
    # preBuildCmd: |-
    #   export LDFLAGS="//'CEE.SCEELIB2(CELQS001)' //'CEE.SCEELIB2(CELQS003)' //'CEE.SCEELIB2(CRTDQCXE)'"
    #
    # For a hard guarantee, bind against side decks copied from your oldest supported system.
    # See native/c/compat/README.md for the member list and caveats.
    # preBuildCmd: |-
    #   export PATH=/usr/lpp/IBM/cnw/v2r1/openxl/bin:$PATH
    #   export LDFLAGS="$(echo $HOME/sidedecks/zosv2r5/*.x)"

    # Environment variables forwarded to the test runner on z/OS (npm run z:test).
    # Use this to enable optional tests that depend on system-specific capabilities.
    # Local ZNP_* env vars always override these values when both are set.
    # testEnv:
    #   # Archival mechanism available on this LPAR (uncomment one):
    #   ZNP_CADISK: "1"      # CA Disk (Broadcom) — uses DARCHIVE / zo data-set restore
    #   ZNP_DFSMSHSM: "1"   # DFSMShsm (IBM)     — uses HMIGRATE / HRECALL
