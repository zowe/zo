name: z/OS Build

on:
  pull_request:
    paths:
      - ".github/workflows/zos-build.yml"
      - "native/**"
  push:
    branches:
      - main
  workflow_call:
    inputs:
      debug:
        required: false
        type: boolean
      version:
        required: false
        type: string
    secrets:
      SSH_MARIST_RACF_HOST:
        required: true
      SSH_MARIST_ZNP_PASS:
        required: true
      SSH_MARIST_ZNP_ID:
        required: true
      SSH_MARIST_HOST_KEY:
        required: true
  workflow_dispatch:

permissions:
  actions: read
  checks: write
  pull-requests: write

jobs:
  build-server:
    runs-on: ubuntu-latest
    concurrency:
      group: "zos-build"
    timeout-minutes: 20
    env:
      # Build and tests share native objects, so they must use the same build type.
      ZOWE_NATIVE_DEBUG: ${{ inputs.debug && '1' || '0' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Set up Credentials
        run: |
          cat << EOF > config.yaml
          activeProfile: default

          profiles:
            default:
              sshProfile:
                host: ${{ secrets.SSH_MARIST_RACF_HOST }}
                port: 65522
                user: "${{ secrets.SSH_MARIST_ZNP_ID }}"
                password: "${{ secrets.SSH_MARIST_ZNP_PASS }}"
              deployDir: "/ZOWE/tmp/zowex"
              hostFingerprint: "${{ secrets.SSH_MARIST_HOST_KEY }}"
              # Open XL C/C++ 2.1 is the newest compiler IBM supports on z/OS 2.5, our minimum
              # supported release. Open XL 2.2 requires z/OS 3.1+, and its newer libc++ raises the
              # Language Environment runtime level every consumer of this artifact must carry.
              # See native/c/compat/README.md and https://github.com/zowe/zowex/issues/871.
              #
              # \$PATH is escaped so it reaches config.yaml literally and is expanded by the z/OS
              # shell, not by this runner's heredoc.
              preBuildCmd: "export PATH=/usr/lpp/IBM/cnw/v2r1/openxl/bin:\$PATH"
          EOF

      - name: Install Dependencies
        run: npm ci --workspaces=false

      - name: Set Build Version
        if: ${{ inputs.version }}
        run: npm pkg set version="$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Build on z/OS
        run: npm run z:rebuild

      # Informational, uploaded as an artifact for inspection. Does not gate: what keeps the binary
      # loadable on the minimum supported release is the Open XL level pinned above.
      - name: List runtime imports
        run: npm run z:imports

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: zo-runtime-imports
          path: listings/*

      - name: Package server artifacts
        # Don't produce artifacts for debug builds; we want release artifacts available from last successful build
        if: ${{ !inputs.debug }}
        run: npm run z:package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zowe-server-bin
          path: packages/sdk/bin/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: pax-artifact-upload
        with:
          name: zowe-server-release
          path: dist/server.pax.Z

      - name: Compare PAX size with main
        id: compare-pax-size
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          read -r RUN_ID MAIN_SHA <<< "$(gh run list --workflow=zos-build.yml --branch=main --event=push --status=success --limit=1 --json=databaseId,headSha --jq='.[0] | [.databaseId, .headSha] | @tsv' 2>/dev/null || true)"
          [[ -n "$RUN_ID" ]] && gh run download "$RUN_ID" --name zowe-server-release --dir /tmp/main 2>/dev/null || true
          MAIN_SHA="$MAIN_SHA" node -e '
            const childProcess = require("child_process");
            const fs = require("fs");
            const paxSize = (pax) => parseInt(childProcess.execSync(`zcat ${pax} | tar -tvf - | awk \x27{sum += $3} END {print sum}\x27`));
            const pr = paxSize("dist/server.pax.Z");
            const main = fs.existsSync("/tmp/main/server.pax.Z") ? paxSize("/tmp/main/server.pax.Z") : 0;
            const pct = main ? ((pr - main) / main * 100).toFixed(2) : 0;
            const sha = process.env.MAIN_SHA;
            const baseline = `[\`${sha.slice(0, 7)}\`](${process.env.REPO_URL}/commit/${sha})`;
            const change = !main ? "" : !Number(pct) ? " (no change)" : ` (${pct > 0 ? "+" : ""}${pct}% from ${baseline})`;
            console.log(`line=- Extracted size: ${(pr / 1048576).toFixed(2)} MB${change}`);
          ' >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v2
        with:
          header: Server artifacts
          number: ${{ github.event.pull_request.number }}
          message: |
            Server artifacts:
             - PAX: ${{ steps.pax-artifact-upload.outputs.artifact-url }}
               ${{ steps.compare-pax-size.outputs.line }}

      - name: Test on z/OS
        run: npm run z:test

      - name: Test Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: ${{ !cancelled() }}
        with:
          name: Test results
          path: native/c/test/test-results.xml
          reporter: java-junit

      - name: Clean up on z/OS
        if: always()
        run: npm run z:delete
