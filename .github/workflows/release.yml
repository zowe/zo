name: Release

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Version number to publish (e.g., 1.0.0)
        required: false
        type: string
      dry-run:
        description: Dry run mode
        required: false
        type: boolean

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        if: ${{ inputs.version != '' }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?(\+[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' - expected semver format, e.g. 1.0.0 or 1.0.0-rc.1"
            exit 1
          fi
        env:
          VERSION: ${{ inputs.version }}

  build:
    if: ${{ github.ref_protected }}
    needs: validate-version
    uses: ./.github/workflows/zos-build.yml
    with:
      debug: ${{ github.event_name == 'schedule' }}
      version: ${{ inputs.version }}
    permissions:
      actions: read
      checks: write
      pull-requests: write
    secrets: inherit

  build-python:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
    # Both native workflows use the same z/OS deployment directory.
    needs: build
    uses: ./.github/workflows/zos-py-build.yml
    with:
      version: ${{ inputs.version }}
    permissions:
      contents: read
      checks: write
    secrets: inherit

  release:
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.build-python.result == 'success' || (needs.build-python.result == 'skipped' && inputs.version == '')) }}
    runs-on: ubuntu-latest
    needs: [build, build-python]
    environment:
      name: ${{ github.event_name == 'schedule' && 'release-nightly' || 'release' }}
    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@68c0efdc951dd2359bbbfa15c48bc67b3ae8e4d6 # v5.2.0
        env:
          JF_ENV_1: ${{ secrets.JF_ARTIFACTORY_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Build Source
        run: |
          npm run build
          git add packages/sdk/src/ZSshConstants.ts
        env:
          ZO_RELEASE_VERSION: ${{ inputs.version }}

      - name: Set Environment
        run: |
          RUN_ID=$([ -z "$VERSION" ] && \
            gh run list --branch=${{ github.ref }} --workflow=zos-build.yml --limit=1 --json=databaseId --jq='.[0].databaseId' || \
            echo "${{ github.run_id }}")
          DATESTAMP=$(date +"%Y-%m-%d-%H%M%S")
          NEW_VERSION=$([ -z "$VERSION" ] && jq -r '.version' package.json || echo "$VERSION")
          NEW_VERSION_SUFFIX=$([ -z "$VERSION" ] && echo "$NEW_VERSION-$DATESTAMP" || echo "$NEW_VERSION")
          TRAIN=$([ -z "$VERSION" ] && echo "Nightly" || echo "Release")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "NEW_VERSION_SUFFIX=$NEW_VERSION_SUFFIX" >> $GITHUB_ENV
          echo "TRAIN=$TRAIN" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}

      - name: Download Server
        run: |
          gh run download $RUN_ID --dir packages/sdk/bin --name zowe-server-bin
          gh run download $RUN_ID --name zowe-server-release
          mkdir dist && mv server.pax.Z dist/zowe-server-${NEW_VERSION_SUFFIX}.pax.Z
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Python
        if: ${{ env.TRAIN == 'Release' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Python publishing dependencies
        if: ${{ env.TRAIN == 'Release' }}
        run: python -m pip install "twine==7.0.0"

      - name: Download Python Wheel
        if: ${{ env.TRAIN == 'Release' }}
        run: gh run download "${{ github.run_id }}" --dir dist/python --name zowe-python-wheel
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check Python Wheel
        if: ${{ env.TRAIN == 'Release' }}
        working-directory: dist/python
        run: |
          sha256sum --check --strict *.whl.sha256
          python -m twine check *.whl

      - name: Run Octorelease
        if: ${{ env.TRAIN == 'Release' }}
        uses: zowe-actions/octorelease@6cf71bdb7ca82117775295e076d63fe7a812f3c8 # v1
        env:
          ALLOW_MAJOR_VERSION: ${{ vars.ALLOW_MAJOR_VERSION }}
          GIT_COMMITTER_NAME: ${{ secrets.ZOWE_ROBOT_USER }}
          GIT_COMMITTER_EMAIL: ${{ secrets.ZOWE_ROBOT_EMAIL }}
          GIT_CREDENTIALS: x-access-token:${{ secrets.ZOWE_ROBOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          NPM_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
          NPM_EMAIL: ${{ secrets.ZOWE_ROBOT_EMAIL }}
        with:
          config-dir: .github
          dry-run: ${{ inputs.dry-run }}
          new-version: ${{ inputs.version }}

      - name: Run NPM Package
        if: ${{ env.TRAIN == 'Nightly'}}
        run: npm run package

      - name: Publish Snapshot to Artifactory
        if: ${{ !inputs.dry-run && env.TRAIN == 'Nightly' }}
        run: |
          jfrog rt u --detailed-summary dist/*cli*.tgz libs-snapshot-local/org/zowe/zowex/CLI/$TRAIN/zowex-for-zowe-cli-$NEW_VERSION_SUFFIX.tgz
          jfrog rt u --detailed-summary dist/*sdk*.tgz libs-snapshot-local/org/zowe/zowex/SDK/$TRAIN/zowe-zowex-for-zowe-sdk-$NEW_VERSION_SUFFIX.tgz
          jfrog rt u --detailed-summary dist/*.pax.Z libs-snapshot-local/org/zowe/zowex/Server/$TRAIN/zowe-server-$NEW_VERSION_SUFFIX.pax.Z

      - name: Publish Release to Artifactory
        if: ${{ !inputs.dry-run && env.TRAIN == 'Release' }}
        run: |
          jfrog rt u --detailed-summary dist/*cli*.tgz libs-release-local/org/zowe/zowex/$NEW_VERSION_SUFFIX/zowex-for-zowe-cli-$NEW_VERSION_SUFFIX.tgz
          jfrog rt u --detailed-summary dist/*sdk*.tgz libs-release-local/org/zowe/zowex/$NEW_VERSION_SUFFIX/zowe-zowex-for-zowe-sdk-$NEW_VERSION_SUFFIX.tgz
          jfrog rt u --detailed-summary dist/*.pax.Z libs-release-local/org/zowe/zowex/$NEW_VERSION_SUFFIX/zowe-server-$NEW_VERSION_SUFFIX.pax.Z

      - name: Publish Python Wheel to Artifactory
        if: ${{ !inputs.dry-run && env.TRAIN == 'Release' }}
        run: python -m twine upload --non-interactive dist/python/*.whl
        env:
          TWINE_REPOSITORY_URL: https://zowe.jfrog.io/artifactory/api/pypi/pypi-release-local/
          TWINE_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
