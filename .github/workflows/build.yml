name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - run: npm ci

      - run: npm run build

      - run: npm run test

      - name: Get z/OS build run ID
        if: ${{ matrix.os == 'ubuntu' }}
        run: |
          RUN_ID=$(gh run list --commit=${{ github.event.pull_request.head.sha || github.sha }} --workflow=zos-build.yml --limit=1 --json=databaseId --jq='.[0].databaseId')
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Watch z/OS build
        if: ${{ matrix.os == 'ubuntu' && env.RUN_ID }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const artifactName = "zowe-server-bin";
            const runId = process.env.RUN_ID;
            const timeoutMs = 30 * 60 * 1000;
            const intervalMs = 5 * 1000;
            const deadline = Date.now() + timeoutMs;
            let attempts = 0;
            const hasArtifact = async () => {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              return data.artifacts.some((a) => a.name === artifactName);
            };
            const isCompleted = async () => {
              const { data: run } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              return run.status === "completed";
            };
            while (Date.now() < deadline) {
              core.info(`Checking for artifact "${artifactName}" (attempt ${++attempts} of ${Math.ceil(timeoutMs / intervalMs)})...`);
              const wasCompleted = await isCompleted();
              if (await hasArtifact()) {
                core.info(`Artifact "${artifactName}" is available`);
                return;
              }
              if (wasCompleted) {
                core.setFailed(`z/OS build run ${runId} completed without producing "${artifactName}"`);
                return;
              }
              await new Promise((r) => setTimeout(r, intervalMs));
            }
            core.setFailed(`Timed out after ${Math.round(timeoutMs / 60000)} minutes waiting for "${artifactName}"`);

      - name: Download server PAX into SDK bin
        if: ${{ matrix.os == 'ubuntu' }}
        run: gh run download $RUN_ID --dir packages/sdk/bin --name zowe-server-bin
        env:
          GH_TOKEN: ${{ github.token }}

      - run: npm run package
        if: ${{ matrix.os == 'ubuntu' }}

      - name: Build Zowe Explorer VSIX
        id: build-vsix
        # if: ${{ matrix.os == 'ubuntu' && contains(github.event.pull_request.labels.*.name, 'build-vsix') }}
        if: ${{ matrix.os == 'ubuntu' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TARGET_REPO: "zowe/zowe-explorer-vscode"
        run: |
          # Check if there is any cross-reference coming from target repo
          API_URL="repos/${REPO}/issues/${PR_NUMBER}/timeline"
          # LINKED_PR=$(gh api $API_URL --paginate -q '
          #   .[] | select(.event == "cross-referenced" and .source.type == "issue"
          #     and .source.issue.pull_request != null and .source.issue.state == "open")
          #   | select(.source.issue.repository.full_name == "'"$TARGET_REPO"'")
          #   | .source.issue.number
          # ')
          git clone --depth 1 https://github.com/zowe/zowe-explorer-vscode.git
          cd zowe-explorer-vscode
          # [[ -n "$LINKED_PR" ]] && git fetch origin pull/${LINKED_PR}/head && git checkout FETCH_HEAD
          git fetch origin test/deploy-over-ssh && git checkout FETCH_HEAD
          npm install -g pnpm@11 && pnpm install
          pnpm --filter zowex-for-zowe-explorer link:zowex ../packages/sdk
          pnpm --filter vscode-extension-for-zowe package

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: cli-artifact-upload
        if: ${{ matrix.os == 'ubuntu' }}
        with:
          name: zowex-for-zowe-cli
          path: dist/zowex-for-zowe-cli-*.tgz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: sdk-artifact-upload
        if: ${{ matrix.os == 'ubuntu' }}
        with:
          name: zowex-sdk
          path: dist/zowe-zowex-for-zowe-sdk-*.tgz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: vsce-artifact-upload
        if: ${{ steps.build-vsix.outcome == 'success' }}
        with:
          name: zowe-explorer-vsix
          path: zowe-explorer-vscode/dist/vscode-extension-for-zowe-*.vsix

      - name: Comment on PR
        if: ${{ github.event_name == 'pull_request' && matrix.os == 'ubuntu' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v2
        with:
          header: Client artifacts
          number: ${{ github.event.pull_request.number }}
          message: |
            Client artifacts:
             - CLI Plug-in: ${{ steps.cli-artifact-upload.outputs.artifact-url }}
             - SDK: ${{ steps.sdk-artifact-upload.outputs.artifact-url }}
             ${{ steps.build-vsix.outcome == 'success' && format('- VSCE: {0}', steps.vsce-artifact-upload.outputs.artifact-url) || '' }}
