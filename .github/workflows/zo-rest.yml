name: zo-rest Package

# Builds the zo REST API (native/java) and assembles the installable Zowe extension
# (zo-rest.pax). Java unit tests run on a GitHub runner; the native libraries and the pax
# are produced on z/OS through the same SSH build tooling and secrets as zos-build.yml.

on:
  pull_request:
    paths:
      - ".github/workflows/zo-rest.yml"
      - "native/java/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/zo-rest.yml"
      - "native/java/**"
  workflow_call:
    secrets:
      SSH_MARIST_RACF_HOST:
        required: true
      SSH_MARIST_ZNP_PASS:
        required: true
      SSH_MARIST_ZNP_ID:
        required: true
      SSH_MARIST_HOST_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            native/java/app/*.gradle
            native/java/app/gradle/wrapper/gradle-wrapper.properties

      - name: Build and test Java app
        working-directory: native/java/app
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: zo-rest-java-test-reports
          path: native/java/app/build/reports/tests/
          if-no-files-found: ignore

  package:
    needs: java-test
    # Secrets are not available to fork PRs
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # Shares the z/OS deploy directory with the other z/OS workflows, so runs are serialized
    concurrency:
      group: "zos-build"
    # native/c build is the long pole; secur, bindings and packaging add to it
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # buildTools.ts builds the jar locally (Gradle) before uploading it to z/OS
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            native/java/app/*.gradle
            native/java/app/gradle/wrapper/gradle-wrapper.properties

      # Same config as zos-build.yml (keep the two in sync)
      - name: Set up Credentials
        run: |
          cat << EOF > config.yaml
          activeProfile: default

          profiles:
            default:
              sshProfile:
                host: ${{ secrets.SSH_MARIST_RACF_HOST }}
                port: 65522
                user: "${{ secrets.SSH_MARIST_ZNP_ID }}"
                password: "${{ secrets.SSH_MARIST_ZNP_PASS }}"
              deployDir: "/ZOWE/tmp/zowex"
              hostFingerprint: "${{ secrets.SSH_MARIST_HOST_KEY }}"
              # Open XL C/C++ 2.1 is the newest compiler supported on z/OS 2.5 (see zos-build.yml).
              # \$PATH is escaped so the z/OS shell expands it, not this runner's heredoc.
              preBuildCmd: "export PATH=/usr/lpp/IBM/cnw/v2r1/openxl/bin:\$PATH"
          EOF

      - name: Install Dependencies
        run: npm ci --workspaces=false

      # Uploads all of native/ (including native/java) and builds native/c, which the
      # bindings link against
      - name: Build native/c on z/OS
        run: npm run z:rebuild

      # Needs Java 8 at /usr/lpp/java/J8.0_64 on the build system (hardcoded in secur/makefile)
      - name: Build libzowe-commons-secur.so on z/OS
        run: npm run z:build:java_secur

      - name: Build libzo_java.so on z/OS
        run: npm run z:build:java_bindings

      - name: Package zo-rest.pax
        run: npm run z:package:java_extension

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zo-rest
          path: native/java/dist/zo-rest.pax
          if-no-files-found: error

      - name: Clean up on z/OS
        if: always()
        run: npm run z:delete
