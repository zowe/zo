name: Lint

on: [pull_request]

jobs:
  lint-client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2

      - name: Run Biome
        run: biome ci --reporter=github packages

  lint-native:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bans string-keyed hash containers (CEE3561S at load time) and by-reference captures in
      # afterAll hooks (silently skipped cleanup). Each script's header explains why.
      - name: Run lint:tidy
        run: npm run lint:tidy

      - name: Run lint:cpp
        run: |
          npm ci --ignore-scripts
          npm run lint:cpp
